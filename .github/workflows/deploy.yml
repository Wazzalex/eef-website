name: Publier le site sur GitHub Pages

# Chaque modification poussée sur la branche `main` reconstruit le site
# et le publie automatiquement (2 à 3 minutes).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Construire le site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          # Le site est servi sous https://wazzalex.github.io/eef-website/
          # → à retirer le jour où un nom de domaine est branché.
          NEXT_PUBLIC_BASE_PATH: /eef-website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Mettre en ligne
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
